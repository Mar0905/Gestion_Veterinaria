<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Mi Agenda</title></head>
<body>

<div class="container-fluid">

  <!-- ── Page Header ──────────────────────────────────────────── -->
  <div class="page-hdr mb-4">
    <div class="page-hdr-left">
      <h2 class="page-title">Mi Agenda</h2>
      <p class="page-subtitle">Citas programadas para atender</p>
    </div>
    <div class="page-hdr-btn">
      <a th:href="@{/veterinarios/atendidas}" class="btn btn-outline-secondary btn-sm">
        <i class="fi fi-sr-clipboard-list"></i> Ver atendidas
      </a>
    </div>
  </div>

  <div class="card">
    <div class="card-header card-header-blue">Citas pendientes</div>
    <div class="card-body p-0">
      <table class="table table-hover mb-0">
        <thead>
          <tr>
            <th>Fecha</th>
            <th>Hora</th>
            <th>Mascota</th>
            <th>Especie</th>
            <th>Motivo</th>
            <th>Estado</th>
            <th>Acción</th>
          </tr>
        </thead>
        <tbody>
          <tr th:if="${#lists.isEmpty(citas)}">
            <td colspan="7" class="text-center text-muted py-4">
              No tienes citas programadas.
            </td>
          </tr>
          <tr th:each="cita : ${citas}">
            <td th:text="${cita.fechaCita}"></td>
            <td th:text="${cita.horaCita}"></td>
            <td class="fw-medium" th:text="${cita.mascota.nombre}"></td>
            <td>
              <span class="badge badge-pendiente" th:text="${cita.mascota.especie}"></span>
            </td>
            <td th:text="${cita.motivo ?: '—'}"></td>
            <td>
              <span class="badge badge-programada" th:text="${cita.estado}"></span>
            </td>
            <td>
              <a th:href="@{/historial/crear/{id}(id=${cita.id})}"
                 class="btn btn-sm btn-primary">
                <i class="fi fi-sr-stethoscope"></i> Atender
              </a>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

</div>

</body>
</html>
