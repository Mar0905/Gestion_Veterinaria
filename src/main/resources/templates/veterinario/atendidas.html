<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Citas Atendidas</title></head>
<body>

<div class="container-fluid">

  <h2 class="fw-bold mb-4">Citas Atendidas</h2>

  <div class="card shadow-sm">
    <div class="card-body p-0">
      <table class="table table-hover mb-0">
        <thead class="table-dark">
          <tr>
            <th>Fecha</th>
            <th>Mascota</th>
            <th>Especie</th>
            <th>Diagnóstico</th>
            <th>Tratamiento</th>
          </tr>
        </thead>
        <tbody>
          <tr th:if="${#lists.isEmpty(citas)}">
            <td colspan="5" class="text-center text-muted py-4">
              No hay citas atendidas aún.
            </td>
          </tr>
          <tr th:each="cita : ${citas}">
            <td th:text="${cita.fechaCita}"></td>
            <td th:text="${cita.mascota.nombre}"></td>
            <td>
              <span class="badge bg-secondary" th:text="${cita.mascota.especie}"></span>
            </td>
            <td th:text="${cita.historialClinico != null ? cita.historialClinico.diagnostico : '—'}"></td>
            <td th:text="${cita.historialClinico != null ? cita.historialClinico.tratamiento : '—'}"></td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

</div>

</body>
</html>
