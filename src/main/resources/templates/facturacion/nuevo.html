<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Nuevo Comprobante</title></head>
<body>

<div class="container-fluid">

  <h2 class="fw-bold mb-4">Nuevo Comprobante</h2>

  <div th:if="${error}" class="alert alert-danger mb-3" th:text="${error}"></div>

  <form th:action="@{/facturacion/guardar}" method="post" id="formComprobante">

    <!-- Cabecera -->
    <div class="row g-3 mb-4">
      <div class="col-md-4">
        <label class="form-label fw-semibold">Cliente</label>
        <select name="clienteId" class="form-select" required>
          <option value="">-- Seleccionar --</option>
          <option th:each="c : ${clientes}"
                  th:value="${c.id}"
                  th:text="${c.nombre + ' ' + c.apellido + ' (' + c.dni + ')'}">
          </option>
        </select>
      </div>
      <div class="col-md-4">
        <label class="form-label fw-semibold">Tipo de comprobante</label>
        <select name="tipo" class="form-select" required>
          <option value="BOLETA">Boleta</option>
          <option value="FACTURA">Factura</option>
        </select>
      </div>
      <div class="col-md-4">
        <label class="form-label fw-semibold">Método de pago</label>
        <select name="metodoPago" class="form-select" required>
          <option value="efectivo">Efectivo</option>
          <option value="tarjeta">Tarjeta</option>
          <option value="yape">Yape</option>
          <option value="plin">Plin</option>
        </select>
      </div>
    </div>

    <!-- Tabla de detalles -->
    <div class="card shadow-sm mb-3">
      <div class="card-header fw-semibold">Detalle de productos / servicios</div>
      <div class="card-body p-0">
        <table class="table table-bordered mb-0" id="tablaDetalles">
          <thead class="table-light">
            <tr>
              <th style="width:25%">Producto (opcional)</th>
              <th>Descripción</th>
              <th style="width:8%">Cant.</th>
              <th style="width:12%">Precio U. (S/)</th>
              <th style="width:10%">Subtotal</th>
              <th style="width:5%"></th>
            </tr>
          </thead>
          <tbody id="tbodyDetalles">
            <tr class="detalle-row">
              <td>
                <select class="form-select form-select-sm prod-select" name="productoId"
                        onchange="onProductoChange(this)">
                  <option value="">-- Manual --</option>
                  <option th:each="p : ${productos}"
                          th:value="${p.id}"
                          th:text="${p.nombre}"
                          th:data-precio="${p.precio}"
                          th:data-nombre="${p.nombre}">
                  </option>
                </select>
              </td>
              <td>
                <input type="text" class="form-control form-control-sm desc-input"
                       name="descripcion" placeholder="Descripción del servicio o producto" required>
              </td>
              <td>
                <input type="number" class="form-control form-control-sm cant-input"
                       name="cantidad" min="1" value="1" required
                       oninput="calcularFila(this.closest('tr')); calcularTotales();">
              </td>
              <td>
                <input type="number" class="form-control form-control-sm precio-input"
                       name="precioUnitario" step="0.01" min="0" value="0.00" required
                       oninput="calcularFila(this.closest('tr')); calcularTotales();">
              </td>
              <td class="subtotal-cell align-middle text-end text-nowrap">S/ 0.00</td>
              <td class="align-middle text-center">
                <button type="button" class="btn btn-sm btn-outline-danger"
                        onclick="removeRow(this)">✕</button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
      <div class="card-footer">
        <button type="button" class="btn btn-outline-secondary btn-sm"
                onclick="addRow()">+ Agregar línea</button>
      </div>
    </div>

    <!-- Totales -->
    <div class="row justify-content-end mb-4">
      <div class="col-md-4 col-lg-3">
        <table class="table table-sm table-borderless mb-0">
          <tr>
            <td class="text-muted">Subtotal:</td>
            <td class="text-end fw-semibold" id="lblSubtotal">S/ 0.00</td>
          </tr>
          <tr>
            <td class="text-muted">IGV (18%):</td>
            <td class="text-end fw-semibold" id="lblIgv">S/ 0.00</td>
          </tr>
          <tr class="table-light">
            <td class="fw-bold fs-5">Total:</td>
            <td class="text-end fw-bold fs-5 text-primary" id="lblTotal">S/ 0.00</td>
          </tr>
        </table>
      </div>
    </div>

    <div class="d-flex gap-2">
      <button type="submit" class="btn btn-success px-4">
        <i class="fi fi-sr-receipt me-1"></i> Emitir Comprobante
      </button>
      <a th:href="@{/facturacion}" class="btn btn-secondary">Cancelar</a>
    </div>

  </form>
</div>

<script>
function addRow() {
  const tbody = document.getElementById('tbodyDetalles');
  const firstRow = tbody.querySelector('.detalle-row');
  const clone = firstRow.cloneNode(true);

  clone.querySelector('.prod-select').value = '';
  clone.querySelector('.desc-input').value = '';
  clone.querySelector('.cant-input').value = '1';
  clone.querySelector('.precio-input').value = '0.00';
  clone.querySelector('.subtotal-cell').textContent = 'S/ 0.00';

  tbody.appendChild(clone);
}

function removeRow(btn) {
  const tbody = document.getElementById('tbodyDetalles');
  if (tbody.querySelectorAll('.detalle-row').length <= 1) return;
  btn.closest('tr').remove();
  calcularTotales();
}

function onProductoChange(select) {
  const row = select.closest('tr');
  const opt = select.options[select.selectedIndex];
  if (opt.value) {
    row.querySelector('.desc-input').value = opt.getAttribute('data-nombre') || opt.text;
    row.querySelector('.precio-input').value = opt.getAttribute('data-precio') || '0.00';
  } else {
    row.querySelector('.desc-input').value = '';
    row.querySelector('.precio-input').value = '0.00';
  }
  calcularFila(row);
  calcularTotales();
}

function calcularFila(row) {
  const cant  = parseFloat(row.querySelector('.cant-input').value) || 0;
  const precio = parseFloat(row.querySelector('.precio-input').value) || 0;
  const sub = cant * precio;
  row.querySelector('.subtotal-cell').textContent = 'S/ ' + sub.toFixed(2);
  return sub;
}

function calcularTotales() {
  let subtotal = 0;
  document.querySelectorAll('.detalle-row').forEach(row => {
    subtotal += (parseFloat(row.querySelector('.cant-input').value) || 0)
              * (parseFloat(row.querySelector('.precio-input').value) || 0);
  });
  const igv   = subtotal * 0.18;
  const total = subtotal + igv;
  document.getElementById('lblSubtotal').textContent = 'S/ ' + subtotal.toFixed(2);
  document.getElementById('lblIgv').textContent      = 'S/ ' + igv.toFixed(2);
  document.getElementById('lblTotal').textContent    = 'S/ ' + total.toFixed(2);
}
</script>

</body>
</html>
