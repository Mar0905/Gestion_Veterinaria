<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head><meta charset="UTF-8"><title>Facturación</title></head>
<body>

<div class="container-fluid">

  <!-- ── Page Header ──────────────────────────────────────────── -->
  <div class="page-hdr">
    <div class="page-hdr-left">
      <h2 class="page-title">Facturación</h2>
      <p class="page-subtitle">Comprobantes de venta registrados</p>
    </div>
    <div class="page-hdr-btn">
      <a th:href="@{/facturacion/nuevo}" class="btn btn-primary">
        <i class="fi fi-sr-plus"></i> Nuevo Comprobante
      </a>
    </div>
  </div>

  <div th:if="${exito}" class="alert alert-success alert-dismissible fade show mb-3">
    <span th:text="${exito}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>
  <div th:if="${error}" class="alert alert-danger alert-dismissible fade show mb-3">
    <span th:text="${error}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>

  <!-- ── Search ───────────────────────────────────────────────── -->
  <div class="card mb-3">
    <div class="card-body" style="padding:12px 16px !important">
      <div class="search-wrapper">
        <i class="fi fi-sr-search search-icon"></i>
        <input type="text" class="form-control"
               placeholder="Buscar por cliente, tipo o método de pago..."
               oninput="filterTable(this,'tablaFacturacion')">
      </div>
    </div>
  </div>

  <!-- ── Table ────────────────────────────────────────────────── -->
  <div class="card">
    <div class="card-header card-header-green d-flex justify-content-between align-items-center">
      <span>Comprobantes emitidos</span>
    </div>
    <div class="card-body p-0">
      <table class="table table-hover mb-0" id="tablaFacturacion">
        <thead>
          <tr>
            <th>#</th>
            <th>Fecha</th>
            <th>Cliente</th>
            <th>Tipo</th>
            <th>Subtotal</th>
            <th>IGV</th>
            <th class="fw-bold">Total</th>
            <th>Pago</th>
            <th class="text-center">Acciones</th>
          </tr>
        </thead>
        <tbody>
          <tr th:if="${#lists.isEmpty(comprobantes)}">
            <td colspan="9" class="text-center text-muted py-4">No hay comprobantes registrados.</td>
          </tr>
          <tr th:each="c : ${comprobantes}">
            <td class="text-muted" th:text="${c.id}"></td>
            <td th:text="${#temporals.format(c.fecha, 'dd/MM/yyyy HH:mm')}"></td>
            <td class="fw-medium" th:text="${c.cliente.nombre + ' ' + c.cliente.apellido}"></td>
            <td>
              <span class="badge"
                    th:classappend="${c.tipo == 'FACTURA'} ? 'badge-programada' : 'badge-disponible'"
                    th:text="${c.tipo}">
              </span>
            </td>
            <td th:text="'S/ ' + ${#numbers.formatDecimal(c.subtotal, 1, 2)}"></td>
            <td class="text-muted" th:text="'S/ ' + ${#numbers.formatDecimal(c.igv, 1, 2)}"></td>
            <td class="fw-bold" style="color:#0ea5e9"
                th:text="'S/ ' + ${#numbers.formatDecimal(c.total, 1, 2)}"></td>
            <td th:text="${c.metodoPago}"></td>
            <td class="text-center text-nowrap">
              <a th:href="@{/facturacion/{id}(id=${c.id})}"
                 class="btn btn-sm btn-outline-secondary me-1" title="Ver detalle">
                <i class="fi fi-sr-eye"></i>
              </a>
              <form sec:authorize="hasRole('ADMIN')"
                    th:action="@{/facturacion/{id}/eliminar(id=${c.id})}"
                    method="post" class="d-inline"
                    onsubmit="return confirm('¿Eliminar este comprobante?')">
                <button type="submit" class="btn btn-sm btn-outline-danger" title="Eliminar">
                  <i class="fi fi-sr-trash"></i>
                </button>
              </form>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

</div>

<script>
function filterTable(input, tableId) {
  var filter = input.value.toLowerCase();
  document.querySelectorAll('#' + tableId + ' tbody tr').forEach(function(row) {
    row.style.display = row.textContent.toLowerCase().includes(filter) ? '' : 'none';
  });
}
</script>

</body>
</html>
