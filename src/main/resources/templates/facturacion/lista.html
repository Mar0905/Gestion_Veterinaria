<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Facturación</title></head>
<body>

<div class="container-fluid">

  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2 class="fw-bold">Comprobantes</h2>
    <a th:href="@{/facturacion/nuevo}" class="btn btn-primary">
      <i class="fi fi-sr-plus me-1"></i> Nuevo Comprobante
    </a>
  </div>

  <!-- Flash messages -->
  <div th:if="${exito}" class="alert alert-success alert-dismissible fade show" role="alert">
    <span th:text="${exito}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>
  <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
    <span th:text="${error}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>

  <div class="card shadow-sm">
    <div class="card-body p-0">
      <table class="table table-hover table-striped mb-0">
        <thead class="table-dark">
          <tr>
            <th>#</th>
            <th>Fecha</th>
            <th>Cliente</th>
            <th>Tipo</th>
            <th>Subtotal</th>
            <th>IGV (18%)</th>
            <th>Total</th>
            <th>Pago</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody>
          <tr th:if="${#lists.isEmpty(comprobantes)}">
            <td colspan="9" class="text-center text-muted py-4">No hay comprobantes registrados.</td>
          </tr>
          <tr th:each="c : ${comprobantes}">
            <td th:text="${c.id}"></td>
            <td th:text="${#temporals.format(c.fecha, 'dd/MM/yyyy HH:mm')}"></td>
            <td th:text="${c.cliente.nombre + ' ' + c.cliente.apellido}"></td>
            <td>
              <span class="badge"
                    th:classappend="${c.tipo == 'FACTURA'} ? 'bg-primary' : 'bg-success'"
                    th:text="${c.tipo}">
              </span>
            </td>
            <td th:text="'S/ ' + ${#numbers.formatDecimal(c.subtotal, 1, 2)}"></td>
            <td th:text="'S/ ' + ${#numbers.formatDecimal(c.igv, 1, 2)}"></td>
            <td class="fw-bold" th:text="'S/ ' + ${#numbers.formatDecimal(c.total, 1, 2)}"></td>
            <td th:text="${c.metodoPago}"></td>
            <td>
              <a th:href="@{/facturacion/{id}(id=${c.id})}"
                 class="btn btn-sm btn-outline-secondary me-1">Ver</a>
              <form th:action="@{/facturacion/{id}/eliminar(id=${c.id})}"
                    method="post" class="d-inline"
                    onsubmit="return confirm('¿Eliminar este comprobante?')">
                <button type="submit" class="btn btn-sm btn-outline-danger">Eliminar</button>
              </form>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
