<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Comprobante</title></head>
<style>
@media print {
  .sidebar, .topbar, .page-hdr-btn { display: none !important; }
  .main-content, .content-area, .container-fluid { display:block !important; width:100% !important; padding:0 !important; margin:0 !important; }
  .card { box-shadow:none !important; border:1px solid #cbd5e1 !important; }
  body { background:#fff !important; font-size:12px; }
  .page-hdr { margin-bottom:16px !important; }
}
</style>
<body>

<div class="container-fluid">

  <!-- ── Page Header ──────────────────────────────────────────── -->
  <div class="page-hdr mb-4">
    <div class="page-hdr-left">
      <p class="page-module">Facturación</p>
      <h2 class="page-title">
        <span th:text="${comprobante.tipo}"></span>
        <span class="fw-normal text-muted" th:text="'#' + ${comprobante.id}"></span>
      </h2>
      <p class="page-subtitle"
         th:text="${#temporals.format(comprobante.fecha, 'dd/MM/yyyy HH:mm')}">
      </p>
    </div>
    <div class="page-hdr-btn d-flex gap-2">
      <button onclick="window.print()" class="btn btn-outline-secondary btn-sm">
        <i class="fi fi-sr-print"></i> Imprimir
      </button>
      <a th:href="@{/facturacion}" class="btn btn-outline-secondary btn-sm">
        <i class="fi fi-sr-arrow-left"></i> Volver
      </a>
    </div>
  </div>

  <!-- ── Datos del cliente ─────────────────────────────────────── -->
  <div class="card mb-3" style="max-width:820px">
    <div class="card-header card-header-blue">Datos del comprobante</div>
    <div class="card-body">
      <div class="row g-3">
        <div class="col-md-6">
          <span class="form-label">Cliente</span>
          <p class="fw-semibold mb-0"
             th:text="${comprobante.cliente.nombre + ' ' + comprobante.cliente.apellido}">
          </p>
          <p class="text-muted small mb-0" th:text="'DNI: ' + ${comprobante.cliente.dni}"></p>
        </div>
        <div class="col-md-3">
          <span class="form-label">Método de pago</span>
          <p class="fw-semibold mb-0 text-capitalize" th:text="${comprobante.metodoPago}"></p>
        </div>
        <div class="col-md-3">
          <span class="form-label">Tipo</span><br>
          <span class="badge"
                th:classappend="${comprobante.tipo == 'FACTURA'} ? 'bg-primary' : 'bg-success'"
                th:text="${comprobante.tipo}" style="font-size:13px">
          </span>
        </div>
      </div>
    </div>
  </div>

  <!-- ── Tabla de detalles ──────────────────────────────────────── -->
  <div class="card mb-3" style="max-width:820px">
    <div class="card-header card-header-green">Detalle de servicios / productos</div>
    <div class="card-body p-0">
      <table class="table mb-0">
        <thead>
          <tr>
            <th>Descripción</th>
            <th class="text-center">Cant.</th>
            <th class="text-end">Precio U.</th>
            <th class="text-end">Subtotal</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="d : ${comprobante.detalles}">
            <td>
              <span th:text="${d.descripcion}"></span>
              <span th:if="${d.producto != null}"
                    class="badge bg-light text-dark ms-1"
                    th:text="${d.producto.categoria}">
              </span>
            </td>
            <td class="text-center" th:text="${d.cantidad}"></td>
            <td class="text-end"
                th:text="'S/ ' + ${#numbers.formatDecimal(d.precioUnitario, 1, 2)}"></td>
            <td class="text-end fw-medium"
                th:text="'S/ ' + ${#numbers.formatDecimal(d.subtotal, 1, 2)}"></td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- ── Totales ────────────────────────────────────────────────── -->
  <div class="d-flex justify-content-end" style="max-width:820px">
    <div class="totales-gradient" style="min-width:240px">
      <div class="d-flex justify-content-between mb-2">
        <span class="text-muted small">Subtotal:</span>
        <span class="fw-semibold"
              th:text="'S/ ' + ${#numbers.formatDecimal(comprobante.subtotal, 1, 2)}"></span>
      </div>
      <div class="d-flex justify-content-between mb-2">
        <span class="text-muted small">IGV (18%):</span>
        <span class="fw-semibold"
              th:text="'S/ ' + ${#numbers.formatDecimal(comprobante.igv, 1, 2)}"></span>
      </div>
      <hr style="border-color:#e9d5ff;margin:10px 0">
      <div class="d-flex justify-content-between align-items-center">
        <strong style="color:#3730a3">Total:</strong>
        <strong class="fs-5" style="color:#7c3aed"
                th:text="'S/ ' + ${#numbers.formatDecimal(comprobante.total, 1, 2)}">
        </strong>
      </div>
    </div>
  </div>

</div>

</body>
</html>
