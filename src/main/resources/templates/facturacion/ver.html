<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Comprobante</title></head>
<body>

<div class="container-fluid" style="max-width:820px">

  <!-- Cabecera del comprobante -->
  <div class="d-flex justify-content-between align-items-start mb-4">
    <div>
      <h2 class="fw-bold mb-1">
        <span th:text="${comprobante.tipo}"></span>
        <span class="text-muted fs-5" th:text="'#' + ${comprobante.id}"></span>
      </h2>
      <p class="text-muted mb-0"
         th:text="${#temporals.format(comprobante.fecha, 'dd/MM/yyyy HH:mm')}">
      </p>
    </div>
    <div class="d-flex gap-2">
      <button onclick="window.print()" class="btn btn-outline-secondary btn-sm">
        <i class="fi fi-sr-print me-1"></i> Imprimir
      </button>
      <a th:href="@{/facturacion}" class="btn btn-secondary btn-sm">Volver</a>
    </div>
  </div>

  <!-- Datos del cliente -->
  <div class="card shadow-sm mb-3">
    <div class="card-body">
      <div class="row">
        <div class="col-md-6">
          <p class="mb-1 text-muted small">Cliente</p>
          <p class="fw-semibold mb-0"
             th:text="${comprobante.cliente.nombre + ' ' + comprobante.cliente.apellido}">
          </p>
          <p class="text-muted small mb-0" th:text="'DNI: ' + ${comprobante.cliente.dni}"></p>
        </div>
        <div class="col-md-3">
          <p class="mb-1 text-muted small">Método de pago</p>
          <p class="fw-semibold mb-0 text-capitalize" th:text="${comprobante.metodoPago}"></p>
        </div>
        <div class="col-md-3">
          <p class="mb-1 text-muted small">Tipo</p>
          <span class="badge fs-6"
                th:classappend="${comprobante.tipo == 'FACTURA'} ? 'bg-primary' : 'bg-success'"
                th:text="${comprobante.tipo}">
          </span>
        </div>
      </div>
    </div>
  </div>

  <!-- Tabla de detalles -->
  <div class="card shadow-sm mb-3">
    <div class="card-body p-0">
      <table class="table table-bordered mb-0">
        <thead class="table-light">
          <tr>
            <th>Descripción</th>
            <th class="text-center">Cant.</th>
            <th class="text-end">Precio U.</th>
            <th class="text-end">Subtotal</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="d : ${comprobante.detalles}">
            <td>
              <span th:text="${d.descripcion}"></span>
              <span th:if="${d.producto != null}"
                    class="badge bg-light text-dark ms-1 small"
                    th:text="${d.producto.categoria}">
              </span>
            </td>
            <td class="text-center" th:text="${d.cantidad}"></td>
            <td class="text-end" th:text="'S/ ' + ${#numbers.formatDecimal(d.precioUnitario, 1, 2)}"></td>
            <td class="text-end fw-semibold" th:text="'S/ ' + ${#numbers.formatDecimal(d.subtotal, 1, 2)}"></td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Totales -->
  <div class="row justify-content-end">
    <div class="col-md-4 col-lg-3">
      <table class="table table-sm table-borderless mb-0">
        <tr>
          <td class="text-muted">Subtotal:</td>
          <td class="text-end" th:text="'S/ ' + ${#numbers.formatDecimal(comprobante.subtotal, 1, 2)}"></td>
        </tr>
        <tr>
          <td class="text-muted">IGV (18%):</td>
          <td class="text-end" th:text="'S/ ' + ${#numbers.formatDecimal(comprobante.igv, 1, 2)}"></td>
        </tr>
        <tr class="table-light">
          <td class="fw-bold fs-5">Total:</td>
          <td class="text-end fw-bold fs-5 text-primary"
              th:text="'S/ ' + ${#numbers.formatDecimal(comprobante.total, 1, 2)}">
          </td>
        </tr>
      </table>
    </div>
  </div>

</div>

</body>
</html>
