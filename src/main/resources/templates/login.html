<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VETSYS — Iniciar Sesión</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Flaticon UI Icons -->
  <link rel="stylesheet"
        href="https://cdn-uicons.flaticon.com/2.6.0/uicons-solid-rounded/css/uicons-solid-rounded.css">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #e0f2fe 0%, #f0f9ff 45%, #ecfdf5 100%);
      padding: 24px;
      position: relative;
      overflow: hidden;
    }

    /* Decorative blobs */
    body::before {
      content: '';
      position: fixed;
      width: 400px; height: 400px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(14,165,233,0.12) 0%, transparent 70%);
      top: -100px; left: -100px;
      pointer-events: none;
    }
    body::after {
      content: '';
      position: fixed;
      width: 350px; height: 350px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(16,185,129,0.10) 0%, transparent 70%);
      bottom: -80px; right: -80px;
      pointer-events: none;
    }

    .login-wrapper {
      width: 100%;
      max-width: 420px;
      position: relative;
      z-index: 1;
    }

    /* ── Brand ── */
    .brand {
      text-align: center;
      margin-bottom: 28px;
    }

    .brand-icon {
      width: 60px; height: 60px;
      border-radius: 16px;
      background: linear-gradient(135deg, #0ea5e9, #06b6d4);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 14px;
      box-shadow: 0 8px 24px rgba(14,165,233,0.35);
    }

    .brand-icon i {
      font-size: 26px;
      color: #fff;
    }

    .brand-title {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(to right, #0ea5e9, #06b6d4);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
      margin-bottom: 6px;
    }

    .brand-subtitle {
      font-size: 13px;
      color: #64748b;
    }

    /* ── Card ── */
    .card {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.10), 0 4px 16px rgba(0,0,0,0.05);
      margin-bottom: 16px;
    }

    .card-title {
      font-size: 20px;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 24px;
    }

    /* ── Alerts ── */
    .alert-error {
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 13px;
      color: #991b1b;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 20px;
    }

    .alert-success {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 13px;
      color: #166534;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 20px;
    }

    /* ── Form ── */
    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #475569;
      margin-bottom: 6px;
    }

    .input-wrapper {
      position: relative;
    }

    .input-icon {
      position: absolute;
      left: 13px;
      top: 50%;
      transform: translateY(-50%);
      color: #0ea5e9;
      font-size: 15px;
      pointer-events: none;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      height: 46px;
      padding: 0 14px 0 42px;
      border: 1.5px solid #e2e8f0;
      border-radius: 10px;
      font-size: 14px;
      font-family: 'Inter', sans-serif;
      color: #0f172a;
      background: #fff;
      transition: border-color 0.15s, box-shadow 0.15s;
      outline: none;
    }

    input[type="text"]:focus,
    input[type="password"]:focus {
      border-color: #0ea5e9;
      box-shadow: 0 0 0 3px rgba(14,165,233,0.15);
    }

    input::placeholder { color: #94a3b8; }

    /* ── Submit button ── */
    .btn-submit {
      width: 100%;
      height: 46px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(to right, #0ea5e9, #06b6d4);
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.15s, box-shadow 0.15s;
      box-shadow: 0 4px 16px rgba(14,165,233,0.40);
      margin-top: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-submit:hover {
      opacity: 0.92;
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(14,165,233,0.50);
    }

    .btn-submit:active {
      transform: translateY(0);
    }

    /* ── Demo credentials ── */
    .demo-box {
      background: linear-gradient(to right, #fff7ed, #fffbeb);
      border: 1px solid #fed7aa;
      border-radius: 12px;
      padding: 16px 18px;
      box-shadow: 0 4px 12px rgba(251,146,60,0.12);
    }

    .demo-title {
      font-size: 11px;
      font-weight: 700;
      color: #7c2d12;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .demo-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .demo-item {
      background: rgba(255,255,255,0.7);
      border: 1px solid #fed7aa;
      border-radius: 8px;
      padding: 8px 10px;
    }

    .demo-role {
      font-size: 10px;
      font-weight: 700;
      color: #9a3412;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      margin-bottom: 2px;
    }

    .demo-creds {
      font-size: 12px;
      color: #7c2d12;
      font-family: 'Courier New', monospace;
      line-height: 1.5;
    }

    .demo-item.full-width {
      grid-column: 1 / -1;
    }
  </style>
</head>
<body>

<div class="login-wrapper">

  <!-- ── Brand ── -->
  <div class="brand">
    <div class="brand-icon">
      <i class="fi fi-sr-paw"></i>
    </div>
    <div class="brand-title">VETSYS</div>
    <div class="brand-subtitle">Sistema de Gestión Veterinaria</div>
  </div>

  <!-- ── Login card ── -->
  <div class="card">
    <div class="card-title">Iniciar Sesión</div>

    <!-- Error / logout messages -->
    <div class="alert-error" th:if="${param.error}">
      <i class="fi fi-sr-triangle-warning"></i>
      <span>Usuario o contraseña incorrectos. Intenta de nuevo.</span>
    </div>
    <div class="alert-success" th:if="${param.logout}">
      <i class="fi fi-sr-check-circle"></i>
      <span>Sesión cerrada correctamente.</span>
    </div>

    <form th:action="@{/login}" method="post">

      <div class="form-group">
        <label for="username">Usuario</label>
        <div class="input-wrapper">
          <i class="fi fi-sr-user input-icon"></i>
          <input type="text" id="username" name="username"
                 placeholder="Ingresa tu usuario" required autofocus>
        </div>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <div class="input-wrapper">
          <i class="fi fi-sr-lock input-icon"></i>
          <input type="password" id="password" name="password"
                 placeholder="Ingresa tu contraseña" required>
        </div>
      </div>

      <button type="submit" class="btn-submit">
        <i class="fi fi-sr-sign-in-alt"></i>
        INGRESAR
      </button>

    </form>
  </div>

  <!-- ── Demo credentials ── -->
  <div class="demo-box">
    <div class="demo-title">
      <i class="fi fi-sr-info" style="font-size:12px"></i>
      Usuarios de demostración
    </div>
    <div class="demo-grid">
      <div class="demo-item">
        <div class="demo-role">Administrador</div>
        <div class="demo-creds">
          admin<br>
          admin123
        </div>
      </div>
      <div class="demo-item">
        <div class="demo-role">Recepción</div>
        <div class="demo-creds">
          recepcion<br>
          recepcion123
        </div>
      </div>
      <div class="demo-item full-width">
        <div class="demo-role">Veterinario — Dr. Carlos López</div>
        <div class="demo-creds">
          carlos<br>
          vet123
        </div>
      </div>
    </div>
  </div>

</div>

</body>
</html>
