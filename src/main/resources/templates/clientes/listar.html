<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Clientes</title></head>
<body>

<div class="container-fluid">

  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2 class="fw-bold">Clientes</h2>
    <a th:href="@{/clientes/nuevo}" class="btn btn-primary">
      <i class="fi fi-sr-plus me-1"></i> Nuevo Cliente
    </a>
  </div>

  <div th:if="${exito}" class="alert alert-success alert-dismissible fade show">
    <span th:text="${exito}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>
  <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
    <span th:text="${error}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>

  <div class="card shadow-sm">
    <div class="card-body p-0">
      <table class="table table-hover table-striped mb-0">
        <thead class="table-dark">
          <tr>
            <th>DNI</th>
            <th>Nombre</th>
            <th>Apellido</th>
            <th>Teléfono</th>
            <th>Email</th>
            <th>Dirección</th>
            <th>Registro</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody>
          <tr th:if="${#lists.isEmpty(clientes)}">
            <td colspan="8" class="text-center text-muted py-4">No hay clientes registrados.</td>
          </tr>
          <tr th:each="c : ${clientes}">
            <td th:text="${c.dni}"></td>
            <td th:text="${c.nombre}"></td>
            <td th:text="${c.apellido}"></td>
            <td th:text="${c.telefono ?: '—'}"></td>
            <td th:text="${c.email ?: '—'}"></td>
            <td th:text="${c.direccion ?: '—'}"></td>
            <td th:text="${c.fechRegistro}"></td>
            <td class="text-nowrap">
              <a th:href="@{/clientes/{id}/mascotas(id=${c.id})}"
                 class="btn btn-sm btn-outline-info me-1" title="Ver mascotas">
                <i class="fi fi-sr-paw"></i>
              </a>
              <a th:href="@{/clientes/{id}/editar(id=${c.id})}"
                 class="btn btn-sm btn-outline-primary me-1">Editar</a>
              <form th:action="@{/clientes/{id}/eliminar(id=${c.id})}"
                    method="post" class="d-inline"
                    onsubmit="return confirm('¿Eliminar cliente ' + '[[${c.nombre}]]' + '?')">
                <button type="submit" class="btn btn-sm btn-outline-danger">Eliminar</button>
              </form>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

</div>

</body>
</html>
