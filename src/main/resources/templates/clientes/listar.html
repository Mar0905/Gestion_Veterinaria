<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Clientes</title></head>
<body>

<div class="container-fluid">

  <!-- ── Page Header ──────────────────────────────────────────── -->
  <div class="page-hdr">
    <div class="page-hdr-left">
      <h2 class="page-title">Clientes y Mascotas</h2>
      <p class="page-subtitle">Gestión de clientes registrados</p>
    </div>
    <div class="page-hdr-btn">
      <a th:href="@{/clientes/nuevo}" class="btn btn-primary">
        <i class="fi fi-sr-plus"></i> Nuevo cliente
      </a>
    </div>
  </div>

  <!-- Flash messages -->
  <div th:if="${exito}" class="alert alert-success alert-dismissible fade show mb-3">
    <span th:text="${exito}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>
  <div th:if="${error}" class="alert alert-danger alert-dismissible fade show mb-3">
    <span th:text="${error}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>

  <div class="row g-3">

    <!-- ── Left: tabla ──────────────────────────────────────── -->
    <div class="col-lg-8">

      <!-- Search -->
      <div class="card mb-3">
        <div class="card-body" style="padding:12px 16px !important">
          <div class="search-wrapper">
            <i class="fi fi-sr-search search-icon"></i>
            <input type="text" id="searchClientes" class="form-control"
                   placeholder="Buscar por nombre, DNI o teléfono..."
                   oninput="filterClientes(this)">
          </div>
        </div>
      </div>

      <!-- Table -->
      <div class="card">
        <div class="card-header card-header-blue d-flex justify-content-between align-items-center">
          <span>Lista de clientes</span>
          <small class="opacity-60" id="countClientes"></small>
        </div>
        <div class="card-body p-0">
          <table class="table table-hover mb-0" id="tablaClientes">
            <thead>
              <tr>
                <th>Nombre</th>
                <th>DNI</th>
                <th>Teléfono</th>
                <th>Registro</th>
                <th class="text-center">Acciones</th>
              </tr>
            </thead>
            <tbody>
              <tr th:if="${#lists.isEmpty(clientes)}">
                <td colspan="5" class="text-center text-muted py-5">
                  <i class="fi fi-sr-users fs-2 d-block mb-2 opacity-40"></i>
                  No hay clientes registrados.
                </td>
              </tr>
              <tr th:each="c : ${clientes}"
                  class="cliente-row"
                  style="cursor:pointer"
                  th:data-id="${c.id}"
                  th:data-nombre="${c.nombre + ' ' + c.apellido}"
                  th:data-dni="${c.dni}"
                  th:data-tel="${c.telefono ?: ''}"
                  th:data-email="${c.email ?: ''}"
                  th:data-fecha="${c.fechRegistro}">
                <td class="fw-medium" th:text="${c.nombre + ' ' + c.apellido}"></td>
                <td class="text-muted" th:text="${c.dni}"></td>
                <td th:text="${c.telefono ?: '—'}"></td>
                <td th:text="${c.fechRegistro}"></td>
                <td class="text-center text-nowrap" onclick="event.stopPropagation()">
                  <a th:href="@{/clientes/{id}/editar(id=${c.id})}"
                     class="btn btn-sm btn-outline-primary me-1" title="Editar">
                    <i class="fi fi-sr-edit"></i>
                  </a>
                  <form th:action="@{/clientes/{id}/eliminar(id=${c.id})}"
                        method="post" class="d-inline"
                        onsubmit="return confirm('¿Eliminar este cliente?')">
                    <button type="submit" class="btn btn-sm btn-outline-danger" title="Eliminar">
                      <i class="fi fi-sr-trash"></i>
                    </button>
                  </form>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- ── Right: detail panel ──────────────────────────────── -->
    <div class="col-lg-4">
      <div class="card" id="clienteDetailCard">
        <div class="card-header card-header-blue">
          <i class="fi fi-sr-user me-1"></i> Detalle del cliente
        </div>
        <div class="card-body">

          <!-- Empty state -->
          <div id="emptyDetail" class="detail-panel-empty">
            <i class="fi fi-sr-users fs-2 mb-2 opacity-40"></i>
            <p class="small text-muted mb-0">Selecciona un cliente de la lista</p>
          </div>

          <!-- Client info (hidden initially) -->
          <div id="clienteInfo" style="display:none">

            <!-- Avatar + nombre -->
            <div class="d-flex align-items-center gap-3 mb-4">
              <div class="detail-avatar" id="detailAvatar">A</div>
              <div>
                <h6 class="mb-0 fw-bold" id="detailNombre"></h6>
                <small class="text-muted">DNI: <span id="detailDni"></span></small>
              </div>
            </div>

            <!-- Info grid -->
            <div class="row g-2 mb-4">
              <div class="col-6">
                <div class="p-2 rounded" style="background:#f8fafc;border:1px solid var(--border)">
                  <p class="small text-muted mb-0" style="font-size:11px">Teléfono</p>
                  <p class="small fw-semibold mb-0" id="detailTel"></p>
                </div>
              </div>
              <div class="col-6">
                <div class="p-2 rounded" style="background:#f8fafc;border:1px solid var(--border)">
                  <p class="small text-muted mb-0" style="font-size:11px">Registro</p>
                  <p class="small fw-semibold mb-0" id="detailFecha"></p>
                </div>
              </div>
              <div class="col-12">
                <div class="p-2 rounded" style="background:#f8fafc;border:1px solid var(--border)">
                  <p class="small text-muted mb-0" style="font-size:11px">Email</p>
                  <p class="small fw-semibold mb-0" id="detailEmail"
                     style="word-break:break-all;font-size:12px"></p>
                </div>
              </div>
            </div>

            <!-- Acciones rápidas -->
            <p class="small fw-semibold text-muted mb-2" style="font-size:11px;text-transform:uppercase;letter-spacing:.5px">Acciones rápidas</p>
            <div class="d-flex flex-column gap-2">
              <a id="detailMascotasLink" href="#" class="btn btn-primary btn-sm">
                <i class="fi fi-sr-paw me-1"></i> Ver mascotas
              </a>
              <a id="detailEditarLink" href="#" class="btn btn-outline-secondary btn-sm">
                <i class="fi fi-sr-edit me-1"></i> Editar cliente
              </a>
            </div>

          </div>
        </div>
      </div>
    </div>

  </div><!-- /row -->

</div>

<script>
/* Click en fila → mostrar detalle */
document.querySelectorAll('.cliente-row').forEach(function(row) {
  row.addEventListener('click', function() {
    document.querySelectorAll('.cliente-row').forEach(function(r) {
      r.classList.remove('table-active');
    });
    this.classList.add('table-active');

    var id     = this.dataset.id;
    var nombre = this.dataset.nombre;
    var dni    = this.dataset.dni;
    var tel    = this.dataset.tel;
    var email  = this.dataset.email;
    var fecha  = this.dataset.fecha;

    document.getElementById('emptyDetail').style.display  = 'none';
    document.getElementById('clienteInfo').style.display  = '';

    document.getElementById('detailAvatar').textContent  = nombre.charAt(0).toUpperCase();
    document.getElementById('detailNombre').textContent  = nombre;
    document.getElementById('detailDni').textContent     = dni;
    document.getElementById('detailTel').textContent     = tel  || '—';
    document.getElementById('detailEmail').textContent   = email || '—';
    document.getElementById('detailFecha').textContent   = fecha || '—';

    document.getElementById('detailMascotasLink').href = '/clientes/' + id + '/mascotas';
    document.getElementById('detailEditarLink').href   = '/clientes/' + id + '/editar';
  });
});

/* Filtro de búsqueda */
function filterClientes(input) {
  var filter  = input.value.toLowerCase();
  var rows    = document.querySelectorAll('.cliente-row');
  var visible = 0;
  rows.forEach(function(row) {
    var match = row.textContent.toLowerCase().includes(filter);
    row.style.display = match ? '' : 'none';
    if (match) visible++;
  });
  var countEl = document.getElementById('countClientes');
  if (countEl) countEl.textContent = visible + ' resultado(s)';
}

/* Contador inicial */
(function() {
  var rows    = document.querySelectorAll('.cliente-row');
  var countEl = document.getElementById('countClientes');
  if (countEl && rows.length) countEl.textContent = rows.length + ' registro(s)';
})();
</script>

</body>
</html>
