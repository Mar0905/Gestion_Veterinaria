<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Cliente</title></head>
<body>

<div class="container-fluid" style="max-width:640px">

  <h2 class="fw-bold mb-4"
      th:text="${cliente.id != null} ? 'Editar Cliente' : 'Nuevo Cliente'">
  </h2>

  <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

  <form th:action="${cliente.id == null} ? @{/clientes/guardar} : @{/clientes/{id}/actualizar(id=${cliente.id})}"
        th:object="${cliente}"
        method="post">

    <div class="row g-3">

      <div class="col-md-6">
        <label class="form-label fw-semibold">Nombre</label>
        <input type="text" class="form-control" th:field="*{nombre}" required maxlength="100">
      </div>

      <div class="col-md-6">
        <label class="form-label fw-semibold">Apellido</label>
        <input type="text" class="form-control" th:field="*{apellido}" required maxlength="100">
      </div>

      <div class="col-md-4">
        <label class="form-label fw-semibold">DNI</label>
        <input type="text" class="form-control" th:field="*{dni}"
               maxlength="8" pattern="\d{8}"
               th:readonly="${cliente.id != null}"
               th:classappend="${cliente.id != null} ? 'bg-light' : ''"
               required>
        <div class="form-text" th:if="${cliente.id != null}">El DNI no se puede modificar.</div>
      </div>

      <div class="col-md-4">
        <label class="form-label fw-semibold">Teléfono</label>
        <input type="text" class="form-control" th:field="*{telefono}" maxlength="9">
      </div>

      <div class="col-md-4">
        <label class="form-label fw-semibold">Email</label>
        <input type="email" class="form-control" th:field="*{email}" maxlength="100">
      </div>

      <div class="col-12">
        <label class="form-label fw-semibold">Dirección</label>
        <input type="text" class="form-control" th:field="*{direccion}" maxlength="200">
      </div>

    </div>

    <div class="d-flex gap-2 mt-4">
      <button type="submit" class="btn btn-primary"
              th:text="${cliente.id != null} ? 'Actualizar' : 'Guardar'">
      </button>
      <a th:href="@{/clientes}" class="btn btn-secondary">Cancelar</a>
    </div>

  </form>
</div>

</body>
</html>
