<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Registrar Atención</title></head>
<body>

<div class="container-fluid" style="max-width:640px">

  <h2 class="fw-bold mb-1">Registrar Atención Veterinaria</h2>

  <div class="card bg-light border-0 mb-4">
    <div class="card-body py-2 px-3">
      <span class="text-muted small">Mascota:</span>
      <strong th:text="${cita.mascota.nombre}"></strong>
      <span class="mx-2 text-muted">|</span>
      <span class="text-muted small">Fecha:</span>
      <strong th:text="${cita.fechaCita}"></strong>
      <span class="mx-2 text-muted">|</span>
      <span class="text-muted small">Hora:</span>
      <strong th:text="${cita.horaCita}"></strong>
    </div>
  </div>

  <form th:action="@{/historial/guardar}" method="post">
    <input type="hidden" name="citaId" th:value="${citaId}"/>

    <div class="mb-3">
      <label class="form-label fw-semibold">Diagnóstico <span class="text-danger">*</span></label>
      <textarea class="form-control" name="diagnostico" rows="3"
                placeholder="Descripción del diagnóstico..." required></textarea>
    </div>

    <div class="mb-3">
      <label class="form-label fw-semibold">Tratamiento <span class="text-danger">*</span></label>
      <textarea class="form-control" name="tratamiento" rows="3"
                placeholder="Tratamiento indicado..." required></textarea>
    </div>

    <div class="mb-4">
      <label class="form-label fw-semibold">Observaciones <span class="text-muted small">(opcional)</span></label>
      <textarea class="form-control" name="observaciones" rows="2"
                placeholder="Notas adicionales..."></textarea>
    </div>

    <div class="d-flex gap-2">
      <button type="submit" class="btn btn-success px-4">
        <i class="fi fi-sr-check me-1"></i> Guardar Atención
      </button>
      <a th:href="@{/veterinarios/agenda}" class="btn btn-secondary">Cancelar</a>
    </div>
  </form>

</div>

</body>
</html>
