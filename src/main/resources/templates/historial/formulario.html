<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Registrar Atención</title></head>
<body>

<div class="container-fluid">

  <!-- ── Page Header ──────────────────────────────────────────── -->
  <div class="page-hdr mb-4">
    <div class="page-hdr-left">
      <p class="page-module">Historial Clínico</p>
      <h2 class="page-title">Registrar Atención</h2>
    </div>
  </div>

  <!-- ── Contexto de la cita ──────────────────────────────────── -->
  <div class="card mb-4" style="max-width:640px; background:#f0f9ff; border-color:#bae6fd !important">
    <div class="card-body py-3">
      <div class="d-flex gap-4 flex-wrap">
        <div>
          <span class="form-label mb-0">Mascota</span>
          <p class="fw-semibold mb-0" th:text="${cita.mascota.nombre}"></p>
        </div>
        <div>
          <span class="form-label mb-0">Fecha</span>
          <p class="fw-semibold mb-0" th:text="${cita.fechaCita}"></p>
        </div>
        <div>
          <span class="form-label mb-0">Hora</span>
          <p class="fw-semibold mb-0" th:text="${cita.horaCita}"></p>
        </div>
        <div>
          <span class="form-label mb-0">Motivo</span>
          <p class="fw-semibold mb-0" th:text="${cita.motivo ?: '—'}"></p>
        </div>
      </div>
    </div>
  </div>

  <!-- ── Formulario ───────────────────────────────────────────── -->
  <div class="card" style="max-width:640px">
    <div class="card-header card-header-blue">Datos de la consulta</div>
    <div class="card-body">

      <form th:action="@{/historial/guardar}" method="post">
        <input type="hidden" name="citaId" th:value="${citaId}"/>

        <div class="mb-3">
          <label class="form-label">Diagnóstico <span class="text-danger">*</span></label>
          <textarea class="form-control" name="diagnostico" rows="3"
                    placeholder="Descripción del diagnóstico..." required></textarea>
        </div>

        <div class="mb-3">
          <label class="form-label">Tratamiento <span class="text-danger">*</span></label>
          <textarea class="form-control" name="tratamiento" rows="3"
                    placeholder="Tratamiento indicado..." required></textarea>
        </div>

        <div class="mb-4">
          <label class="form-label">Observaciones <span class="text-muted small">(opcional)</span></label>
          <textarea class="form-control" name="observaciones" rows="2"
                    placeholder="Notas adicionales..."></textarea>
        </div>

        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-success">
            <i class="fi fi-sr-check"></i> Guardar Atención
          </button>
          <a th:href="@{/veterinarios/agenda}" class="btn btn-outline-secondary">Cancelar</a>
        </div>
      </form>

    </div>
  </div>

</div>

</body>
</html>
