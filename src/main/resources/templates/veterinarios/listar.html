<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Veterinarios</title></head>
<body>

<div class="container-fluid">

  <!-- ── Page Header ──────────────────────────────────────────── -->
  <div class="page-hdr mb-4">
    <div class="page-hdr-left">
      <h2 class="page-title">Veterinarios</h2>
      <p class="page-subtitle">Equipo médico registrado</p>
    </div>
  </div>

  <!-- ── Search ───────────────────────────────────────────────── -->
  <div class="card mb-3">
    <div class="card-body" style="padding:12px 16px !important">
      <div class="search-wrapper">
        <i class="fi fi-sr-search search-icon"></i>
        <input type="text" class="form-control"
               placeholder="Buscar por nombre o especialidad..."
               oninput="filterTable(this,'tablaVets')">
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-header card-header-green">Lista de veterinarios</div>
    <div class="card-body p-0">
      <table class="table table-hover mb-0" id="tablaVets">
        <thead>
          <tr>
            <th>Nombre</th>
            <th>Especialidad</th>
            <th>Teléfono</th>
            <th>Citas totales</th>
            <th>Disponibilidad</th>
          </tr>
        </thead>
        <tbody>
          <tr th:if="${#lists.isEmpty(veterinarios)}">
            <td colspan="5" class="text-center text-muted py-4">No hay veterinarios registrados.</td>
          </tr>
          <tr th:each="v : ${veterinarios}">
            <td class="fw-medium" th:text="${v.nombre}"></td>
            <td th:text="${v.especialidad ?: '—'}"></td>
            <td th:text="${v.telefono ?: '—'}"></td>
            <td th:text="${veterinarioService.contarCitas(v.id)}"></td>
            <td>
              <span class="badge"
                    th:with="disp=${veterinarioService.disponibilidadHoy(v.id)}"
                    th:classappend="${disp == 'Disponible'} ? 'badge-disponible' : 'badge-ocupado'"
                    th:text="${disp}">
              </span>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

</div>

<script>
function filterTable(input, tableId) {
  var filter = input.value.toLowerCase();
  document.querySelectorAll('#' + tableId + ' tbody tr').forEach(function(row) {
    row.style.display = row.textContent.toLowerCase().includes(filter) ? '' : 'none';
  });
}
</script>

</body>
</html>
