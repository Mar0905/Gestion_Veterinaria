<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Veterinarios</title></head>
<body>

<div class="container-fluid">

  <h2 class="fw-bold mb-4">Veterinarios</h2>

  <div class="card shadow-sm">
    <div class="card-body p-0">
      <table class="table table-hover table-striped mb-0">
        <thead class="table-dark">
          <tr>
            <th>Nombre</th>
            <th>Especialidad</th>
            <th>Teléfono</th>
            <th>Citas totales</th>
            <th>Disponibilidad hoy</th>
          </tr>
        </thead>
        <tbody>
          <tr th:if="${#lists.isEmpty(veterinarios)}">
            <td colspan="5" class="text-center text-muted py-4">No hay veterinarios registrados.</td>
          </tr>
          <tr th:each="v : ${veterinarios}">
            <td th:text="${v.nombre}"></td>
            <td th:text="${v.especialidad ?: '—'}"></td>
            <td th:text="${v.telefono ?: '—'}"></td>
            <td th:text="${veterinarioService.contarCitas(v.id)}"></td>
            <td>
              <span class="badge"
                    th:with="disp=${veterinarioService.disponibilidadHoy(v.id)}"
                    th:classappend="${disp == 'Disponible'} ? 'bg-success' : 'bg-danger'"
                    th:text="${disp}">
              </span>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

</div>

</body>
</html>
