<head>
  <link rel="stylesheet" th:href="@{/css/menu-sidebar.css}">
</head>

<nav xmlns:th="http://www.thymeleaf.org"
     xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
     th:fragment="menu">

  <!-- ── Brand / Logo ────────────────────────────────────────── -->
  <div class="sb-logo">
    <div class="sb-logo-icon">
      <i class="fi fi-sr-paw"></i>
    </div>
    <div>
      <span class="sb-brand">VETSYS</span>
      <span class="sb-tagline">Gestión Veterinaria</span>
    </div>
  </div>

  <!-- ── Nav items ───────────────────────────────────────────── -->
  <div class="sb-nav">

    <!-- ADMIN + RECEPCION -->
    <a class="sb-link"
       sec:authorize="hasAnyRole('ADMIN','RECEPCION')"
       th:href="@{/}">
      <i class="fi fi-sr-apps"></i>
      Dashboard
    </a>

    <a class="sb-link"
       sec:authorize="hasAnyRole('ADMIN','RECEPCION')"
       th:href="@{/clientes}">
      <i class="fi fi-sr-users"></i>
      Clientes
    </a>

    <a class="sb-link"
       sec:authorize="hasAnyRole('ADMIN','RECEPCION')"
       th:href="@{/mascotas}">
      <i class="fi fi-sr-paw"></i>
      Mascotas
    </a>

    <a class="sb-link"
       sec:authorize="hasAnyRole('ADMIN','RECEPCION')"
       th:href="@{/citas}">
      <i class="fi fi-sr-calendar"></i>
      Citas
    </a>

    <a class="sb-link"
       sec:authorize="hasAnyRole('ADMIN','VETERINARIO','RECEPCION')"
       th:href="@{/historial}">
      <i class="fi fi-sr-clipboard-list"></i>
      Historial
    </a>

    <a class="sb-link"
       sec:authorize="hasRole('ADMIN')"
       th:href="@{/inventario}">
      <i class="fi fi-sr-box"></i>
      Inventario
    </a>

    <a class="sb-link"
       sec:authorize="hasAnyRole('ADMIN','RECEPCION')"
       th:href="@{/facturacion}">
      <i class="fi fi-sr-receipt"></i>
      Facturación
    </a>

    <a class="sb-link"
       sec:authorize="hasRole('ADMIN')"
       th:href="@{/reportes}">
      <i class="fi fi-sr-chart-histogram"></i>
      Reportes
    </a>

    <hr class="sb-divider" sec:authorize="hasRole('ADMIN')">

    <a class="sb-link"
       sec:authorize="hasRole('ADMIN')"
       th:href="@{/admin}">
      <i class="fi fi-sr-settings"></i>
      Administración
    </a>

    <!-- VETERINARIO -->
    <a class="sb-link"
       sec:authorize="hasRole('VETERINARIO')"
       th:href="@{/veterinarios/agenda}">
      <i class="fi fi-sr-calendar-check"></i>
      Mi Agenda
    </a>

    <a class="sb-link"
       sec:authorize="hasRole('VETERINARIO')"
       th:href="@{/veterinarios/atendidas}">
      <i class="fi fi-sr-clipboard-list"></i>
      Atendidas
    </a>

    <a class="sb-link"
       sec:authorize="hasRole('VETERINARIO')"
       th:href="@{/}">
      <i class="fi fi-sr-apps"></i>
      Inicio
    </a>

  </div>

  <!-- ── Footer: usuario + logout ────────────────────────────── -->
  <div class="sb-footer">

    <div class="sb-user" sec:authorize="isAuthenticated()">
      <div class="sb-avatar">
        <span sec:authentication="name" th:text="${#strings.substring(#authentication.name, 0, 1).toUpperCase()}">U</span>
      </div>
      <div>
        <span class="sb-user-name" sec:authentication="name"></span>
        <span class="sb-user-role"
              sec:authorize="hasRole('ADMIN')">Administrador</span>
        <span class="sb-user-role"
              sec:authorize="hasRole('RECEPCION')">Recepción</span>
        <span class="sb-user-role"
              sec:authorize="hasRole('VETERINARIO')">Veterinario</span>
      </div>
    </div>

    <a th:href="@{/logout}" class="sb-logout">
      <i class="fi fi-sr-sign-out-alt"></i>
      Cerrar Sesión
    </a>

  </div>

</nav>
