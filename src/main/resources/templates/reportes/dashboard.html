<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Dashboard</title></head>
<body>

<div class="container-fluid">

  <!-- ── Page Header ──────────────────────────────────────────── -->
  <div class="page-hdr mb-4">
    <div class="page-hdr-left">
      <h2 class="page-title">PANEL PRINCIPAL</h2>
      <p class="page-subtitle">Resumen estadístico del sistema</p>
    </div>
  </div>

  <!-- ── KPI Cards ────────────────────────────────────────────── -->
  <div class="row g-3 mb-4">

    <div class="col-6 col-xl-3">
      <div class="kpi-card kpi-blue">
        <span class="kpi-value" th:text="${totalClientes}">0</span>
        <span class="kpi-label">Clientes registrados</span>
      </div>
    </div>

    <div class="col-6 col-xl-3">
      <div class="kpi-card kpi-orange">
        <span class="kpi-value" th:text="${totalMascotas}">0</span>
        <span class="kpi-label">Mascotas</span>
      </div>
    </div>

    <div class="col-6 col-xl-3">
      <div class="kpi-card kpi-green">
        <span class="kpi-value" th:text="${citasProgramadas}">0</span>
        <span class="kpi-label">Citas programadas</span>
      </div>
    </div>

    <div class="col-6 col-xl-3">
      <div class="kpi-card kpi-purple">
        <span class="kpi-value"
              th:text="'S/ ' + ${#numbers.formatDecimal(ingresosDelMes, 1, 2)}">S/ 0</span>
        <span class="kpi-label">Ingresos del mes</span>
      </div>
    </div>

    <div class="col-6 col-xl-3">
      <div class="kpi-card kpi-teal">
        <span class="kpi-value" th:text="${totalVeterinarios}">0</span>
        <span class="kpi-label">Veterinarios</span>
      </div>
    </div>

    <div class="col-6 col-xl-3">
      <div class="kpi-card kpi-slate">
        <span class="kpi-value" th:text="${comprobantesDelMes}">0</span>
        <span class="kpi-label">Comprobantes (mes)</span>
      </div>
    </div>

    <div class="col-6 col-xl-3">
      <div class="kpi-card"
           th:classappend="${stockBajo > 0} ? 'kpi-orange' : 'kpi-slate'">
        <span class="kpi-value" th:text="${stockBajo}">0</span>
        <span class="kpi-label">Productos stock bajo</span>
      </div>
    </div>

  </div>

  <!-- ── Gráficos fila 1 ──────────────────────────────────────── -->
  <div class="row g-3 mb-3">

    <div class="col-md-6 col-xl-4">
      <div class="card h-100">
        <div class="card-header card-header-blue">Citas por Estado</div>
        <div class="card-body d-flex align-items-center justify-content-center">
          <canvas id="chartCitas" style="max-height:260px"></canvas>
        </div>
      </div>
    </div>

    <div class="col-md-6 col-xl-4">
      <div class="card h-100">
        <div class="card-header card-header-green">Comprobantes por Tipo</div>
        <div class="card-body d-flex align-items-center justify-content-center">
          <canvas id="chartTipos" style="max-height:260px"></canvas>
        </div>
      </div>
    </div>

    <div class="col-md-12 col-xl-4">
      <div class="card h-100">
        <div class="card-header card-header-orange">Mascotas por Especie</div>
        <div class="card-body d-flex align-items-center justify-content-center">
          <canvas id="chartEspecies" style="max-height:260px"></canvas>
        </div>
      </div>
    </div>

  </div>

  <!-- ── Ingresos ──────────────────────────────────────────────── -->
  <div class="row g-3">
    <div class="col-12">
      <div class="card">
        <div class="card-header card-header-purple">Ingresos Últimos 6 Meses (S/)</div>
        <div class="card-body">
          <canvas id="chartIngresos" style="max-height:280px"></canvas>
        </div>
      </div>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>

<script th:inline="javascript">
/*<![CDATA[*/
var citasLabels    = /*[[${citasLabels}]]*/ [];
var citasCounts    = /*[[${citasCounts}]]*/ [];
var ingresosLabels = /*[[${ingresosLabels}]]*/ [];
var ingresosData   = /*[[${ingresosData}]]*/ [];
var especiesLabels = /*[[${especiesLabels}]]*/ [];
var especiesData   = /*[[${especiesData}]]*/ [];
var tiposLabels    = /*[[${tiposLabels}]]*/ [];
var tiposData      = /*[[${tiposData}]]*/ [];

Chart.defaults.font.family = "'Inter', system-ui, sans-serif";
Chart.defaults.font.size   = 12;

new Chart(document.getElementById('chartCitas'), {
    type: 'doughnut',
    data: {
        labels: citasLabels,
        datasets: [{
            data: citasCounts,
            backgroundColor: ['#3b82f6','#10b981','#f97316'],
            borderWidth: 2,
            borderColor: '#fff'
        }]
    },
    options: {
        plugins: { legend: { position: 'bottom', labels: { padding: 16, font: { size: 11 } } } },
        cutout: '62%'
    }
});

new Chart(document.getElementById('chartTipos'), {
    type: 'doughnut',
    data: {
        labels: tiposLabels,
        datasets: [{
            data: tiposData,
            backgroundColor: ['#10b981','#3b82f6'],
            borderWidth: 2,
            borderColor: '#fff'
        }]
    },
    options: {
        plugins: { legend: { position: 'bottom', labels: { padding: 16, font: { size: 11 } } } },
        cutout: '62%'
    }
});

new Chart(document.getElementById('chartEspecies'), {
    type: 'bar',
    data: {
        labels: especiesLabels,
        datasets: [{
            label: 'Mascotas',
            data: especiesData,
            backgroundColor: ['#3b82f6','#f97316','#10b981','#a855f7','#14b8a6','#f43f5e'],
            borderRadius: 6
        }]
    },
    options: {
        indexAxis: 'y',
        plugins: { legend: { display: false } },
        scales: { x: { ticks: { precision: 0 }, grid: { color: '#f1f5f9' } } }
    }
});

new Chart(document.getElementById('chartIngresos'), {
    type: 'line',
    data: {
        labels: ingresosLabels,
        datasets: [{
            label: 'Ingresos (S/)',
            data: ingresosData,
            borderColor: '#8b5cf6',
            backgroundColor: 'rgba(139,92,246,0.08)',
            pointBackgroundColor: '#8b5cf6',
            tension: 0.4,
            fill: true,
            borderWidth: 2.5,
            pointRadius: 5,
            pointHoverRadius: 7
        }]
    },
    options: {
        plugins: { legend: { display: false } },
        scales: {
            y: {
                beginAtZero: true,
                grid: { color: '#f1f5f9' },
                ticks: { callback: function(v) { return 'S/ ' + v.toFixed(0); } }
            },
            x: { grid: { display: false } }
        }
    }
});
/*]]>*/
</script>

</body>
</html>
