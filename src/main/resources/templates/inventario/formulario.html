<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Producto</title></head>
<body>

<div class="container-fluid">

  <!-- ── Page Header ──────────────────────────────────────────── -->
  <div class="page-hdr mb-4">
    <div class="page-hdr-left">
      <p class="page-module">Inventario</p>
      <h2 class="page-title"
          th:text="${producto.id != null} ? 'Editar Producto' : 'Nuevo Producto'"></h2>
    </div>
  </div>

  <div class="card" style="max-width:640px">
    <div class="card-header card-header-purple">Datos del producto</div>
    <div class="card-body">

      <form th:action="${producto.id == null} ? @{/inventario/guardar} : @{/inventario/{id}/actualizar(id=${producto.id})}"
            th:object="${producto}"
            method="post">

        <div class="mb-3">
          <label class="form-label">Nombre</label>
          <input type="text" class="form-control" th:field="*{nombre}"
                 placeholder="Ej. Amoxicilina 500mg" required maxlength="150">
        </div>

        <div class="mb-3">
          <label class="form-label">Categoría</label>
          <select class="form-select" th:field="*{categoria}" required>
            <option value="">— Seleccionar —</option>
            <option value="medicamento">Medicamento</option>
            <option value="alimento">Alimento</option>
            <option value="accesorio">Accesorio</option>
          </select>
        </div>

        <div class="row g-3 mb-3">
          <div class="col-md-4">
            <label class="form-label">Precio (S/)</label>
            <input type="number" class="form-control" th:field="*{precio}"
                   step="0.01" min="0" required>
          </div>
          <div class="col-md-4">
            <label class="form-label">Stock actual</label>
            <input type="number" class="form-control" th:field="*{stock}" min="0" required>
          </div>
          <div class="col-md-4">
            <label class="form-label">Stock mínimo</label>
            <input type="number" class="form-control" th:field="*{stockMinimo}" min="0" required>
          </div>
        </div>

        <div class="mb-4">
          <label class="form-label">Fecha de vencimiento <span class="text-muted">(opcional)</span></label>
          <input type="date" class="form-control" th:field="*{fechaVencimiento}">
        </div>

        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-primary">
            <i class="fi fi-sr-check"></i>
            <span th:text="${producto.id != null} ? 'Actualizar' : 'Guardar'"></span>
          </button>
          <a th:href="@{/inventario}" class="btn btn-outline-secondary">Cancelar</a>
        </div>

      </form>

    </div>
  </div>

</div>

</body>
</html>
