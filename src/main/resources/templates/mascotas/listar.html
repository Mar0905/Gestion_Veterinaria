<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Mascotas</title></head>
<body>

<div class="container-fluid">

  <div class="d-flex justify-content-between align-items-center mb-1">
    <div>
      <h2 class="fw-bold mb-0">Mascotas</h2>
      <p class="text-muted mb-0">
        Cliente:
        <strong th:text="${cliente.nombre + ' ' + cliente.apellido}"></strong>
        <span class="text-muted small" th:text="'(DNI: ' + ${cliente.dni} + ')'"></span>
      </p>
    </div>
    <div class="d-flex gap-2">
      <a th:href="@{/clientes/{id}/mascotas/nueva(id=${cliente.id})}"
         class="btn btn-primary">
        <i class="fi fi-sr-plus me-1"></i> Nueva Mascota
      </a>
      <a th:href="@{/clientes}" class="btn btn-outline-secondary">
        <i class="fi fi-sr-arrow-left me-1"></i> Volver
      </a>
    </div>
  </div>

  <hr class="mt-2 mb-3">

  <div th:if="${exito}" class="alert alert-success alert-dismissible fade show">
    <span th:text="${exito}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>

  <div class="card shadow-sm">
    <div class="card-body p-0">
      <table class="table table-hover table-striped mb-0">
        <thead class="table-dark">
          <tr>
            <th>Nombre</th>
            <th>Especie</th>
            <th>Raza</th>
            <th>Sexo</th>
            <th>Edad</th>
            <th>Peso (kg)</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody>
          <tr th:if="${#lists.isEmpty(mascotas)}">
            <td colspan="7" class="text-center text-muted py-4">
              Este cliente no tiene mascotas registradas.
            </td>
          </tr>
          <tr th:each="m : ${mascotas}">
            <td th:text="${m.nombre}"></td>
            <td>
              <span class="badge bg-secondary" th:text="${m.especie}"></span>
            </td>
            <td th:text="${m.raza ?: '—'}"></td>
            <td th:text="${m.sexo ?: '—'}"></td>
            <td th:text="${m.edad + ' año(s)'}"></td>
            <td th:text="${m.peso}"></td>
            <td class="text-nowrap">
              <a th:href="@{/clientes/{cid}/mascotas/{mid}/editar(cid=${cliente.id}, mid=${m.id})}"
                 class="btn btn-sm btn-outline-primary me-1">Editar</a>
              <form th:action="@{/clientes/{cid}/mascotas/{mid}/eliminar(cid=${cliente.id}, mid=${m.id})}"
                    method="post" class="d-inline"
                    onsubmit="return confirm('¿Eliminar esta mascota?')">
                <button type="submit" class="btn btn-sm btn-outline-danger">Eliminar</button>
              </form>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

</div>

</body>
</html>
