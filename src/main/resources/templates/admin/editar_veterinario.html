<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Editar Veterinario</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4" style="max-width:560px;margin:auto">

<h2 class="fw-bold mb-4">Editar Veterinario</h2>

<form th:action="@{/admin/veterinarios/{id}/actualizar(id=${veterinario.id})}"
      th:object="${veterinario}"
      method="post">

  <div class="mb-3">
    <label class="form-label fw-semibold">Nombre</label>
    <input type="text" class="form-control" th:field="*{nombre}" required>
  </div>

  <div class="mb-3">
    <label class="form-label fw-semibold">Especialidad</label>
    <input type="text" class="form-control" th:field="*{especialidad}" required>
  </div>

  <div class="mb-3">
    <label class="form-label fw-semibold">Teléfono</label>
    <input type="text" class="form-control" th:field="*{telefono}" maxlength="9">
  </div>

  <div class="d-flex gap-2">
    <button type="submit" class="btn btn-primary">Actualizar</button>
    <a th:href="@{/admin}" class="btn btn-secondary">Cancelar</a>
  </div>

</form>

</body>
</html>
