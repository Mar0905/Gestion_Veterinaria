<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Editar Veterinario</title></head>
<body>

<div class="container-fluid">

  <!-- ── Page Header ──────────────────────────────────────────── -->
  <div class="page-hdr mb-4">
    <div class="page-hdr-left">
      <p class="page-module">Administración</p>
      <h2 class="page-title">Editar Veterinario</h2>
    </div>
  </div>

  <div class="card" style="max-width:520px">
    <div class="card-header">Datos del veterinario</div>
    <div class="card-body">

      <form th:action="@{/admin/veterinarios/{id}/actualizar(id=${veterinario.id})}"
            th:object="${veterinario}"
            method="post">

        <div class="mb-3">
          <label class="form-label">Nombre</label>
          <input type="text" class="form-control" th:field="*{nombre}" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Especialidad</label>
          <input type="text" class="form-control" th:field="*{especialidad}" required>
        </div>

        <div class="mb-4">
          <label class="form-label">Teléfono</label>
          <input type="text" class="form-control" th:field="*{telefono}" maxlength="9">
        </div>

        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-primary">
            <i class="fi fi-sr-check"></i> Actualizar
          </button>
          <a th:href="@{/admin}" class="btn btn-outline-secondary">Cancelar</a>
        </div>

      </form>

    </div>
  </div>

</div>

</body>
</html>
