<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Nuevo Veterinario</title></head>
<body>

<div class="container-fluid" style="max-width:560px">

  <h2 class="fw-bold mb-4">Registrar Veterinario</h2>

  <form th:action="@{/admin/veterinarios/guardar}" method="post" th:object="${veterinario}">

    <div class="card shadow-sm mb-4">
      <div class="card-header fw-semibold">Datos del veterinario</div>
      <div class="card-body">

        <div class="mb-3">
          <label class="form-label fw-semibold">Nombre</label>
          <input type="text" class="form-control" th:field="*{nombre}" required>
        </div>

        <div class="mb-3">
          <label class="form-label fw-semibold">Especialidad</label>
          <input type="text" class="form-control" th:field="*{especialidad}" required>
        </div>

        <div class="mb-0">
          <label class="form-label fw-semibold">Teléfono</label>
          <input type="text" class="form-control" th:field="*{telefono}" maxlength="9">
        </div>

      </div>
    </div>

    <div class="card shadow-sm mb-4">
      <div class="card-header fw-semibold">Credenciales de acceso</div>
      <div class="card-body">

        <div class="mb-3">
          <label class="form-label fw-semibold">Usuario</label>
          <input type="text" class="form-control" name="username" required
                 autocomplete="new-password">
        </div>

        <div class="mb-0">
          <label class="form-label fw-semibold">Contraseña</label>
          <input type="password" class="form-control" name="password" required
                 autocomplete="new-password">
        </div>

      </div>
    </div>

    <div class="d-flex gap-2">
      <button type="submit" class="btn btn-primary">Guardar Veterinario</button>
      <a th:href="@{/admin}" class="btn btn-secondary">Cancelar</a>
    </div>

  </form>
</div>

</body>
</html>
