<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Nuevo Veterinario</title></head>
<body>

<div class="container-fluid">

  <!-- ── Page Header ──────────────────────────────────────────── -->
  <div class="page-hdr mb-4">
    <div class="page-hdr-left">
      <p class="page-module">Administración</p>
      <h2 class="page-title">Registrar Veterinario</h2>
    </div>
  </div>

  <!-- Un solo formulario crea dos registros: el Veterinario y su Usuario de acceso con rol VETERINARIO
       (ver AdminController.guardarVeterinario) -->
  <form th:action="@{/admin/veterinarios/guardar}" method="post"
        th:object="${veterinario}" style="max-width:560px">

    <div class="card mb-4">
      <div class="card-header">Datos del veterinario</div>
      <div class="card-body">

        <div class="mb-3">
          <label class="form-label">Nombre</label>
          <input type="text" class="form-control" th:field="*{nombre}" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Especialidad</label>
          <input type="text" class="form-control" th:field="*{especialidad}" required>
        </div>

        <div class="mb-0">
          <label class="form-label">Teléfono</label>
          <input type="text" class="form-control" th:field="*{telefono}" maxlength="9">
        </div>

      </div>
    </div>

    <!-- Estos campos no pertenecen a la entidad Veterinario: se envían como parámetros aparte
         y el controlador los usa para crear el Usuario (username/password cifrado) -->
    <div class="card mb-4">
      <div class="card-header">Credenciales de acceso</div>
      <div class="card-body">

        <div class="mb-3">
          <label class="form-label">Usuario</label>
          <input type="text" class="form-control" name="username" required
                 autocomplete="new-password">
        </div>

        <div class="mb-0">
          <label class="form-label">Contraseña</label>
          <input type="password" class="form-control" name="password" required
                 autocomplete="new-password">
        </div>

      </div>
    </div>

    <div class="d-flex gap-2">
      <button type="submit" class="btn btn-primary">
        <i class="fi fi-sr-check"></i> Guardar Veterinario
      </button>
      <a th:href="@{/admin}" class="btn btn-outline-secondary">Cancelar</a>
    </div>

  </form>

</div>

</body>
</html>
